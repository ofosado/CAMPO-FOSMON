<!doctype html>
<!--
  Esta página casi nunca se ve: `_redirects` atrapa `/*` antes. Existe para el
  cliente que ignore el 302 —algún lector de correo, algún rastreador— y para
  que el sitio no se publique vacío. No tiene estilos ni JavaScript a propósito:
  si alguien llega hasta aquí es porque algo ya falló, y lo último que ayuda es
  una página que tarde en cargar.

  Cuando #90 (la landing pública) llegue, este archivo se reemplaza y la regla
  `/*` del `_redirects` se borra. Hasta entonces, el enlace de abajo es la
  única salida.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>cotea</title>
  <link rel="canonical" href="https://app.cotea.com.mx/">
  <meta http-equiv="refresh" content="0; url=https://app.cotea.com.mx/">
</head>
<body>
  <h1>cotea</h1>
  <p>La aplicación vive en <a href="https://app.cotea.com.mx/">app.cotea.com.mx</a>.</p>
</body>
</html>
