<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14181C" />
    <meta name="description" content="cotea — control de avance de obra." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- El nombre y los íconos ya son los de cotea (antes CAMPO/FOSMON). Lo
         que NO se movió es la identidad de la app instalada: `scope` y
         `start_url` siguen en `/`, y el manifiesto ahora fija `id: '/'` para
         que no se puedan mover por accidente. Por eso un iPhone de FOSMON que
         tenga la app en la pantalla de inicio la conserva; lo que no hace iOS
         es repintar el ícono ni el rótulo de una app ya instalada —se queda
         con los que cacheó al instalarla y sólo cambian si el usuario la
         borra y la vuelve a agregar—. De ahí el aviso previo: no es por
         riesgo de que se rompa, es porque si no se avisa, la mitad de los
         teléfonos van a seguir diciendo CAMPO y nadie va a saber por qué. -->
    <meta name="apple-mobile-web-app-title" content="cotea" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Respaldo PNG del favicon para los navegadores que no toman el SVG. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- 180×180 es la medida que iOS pide para el ícono de la pantalla de
         inicio. Antes apuntaba a `/icon-192.png`, que iOS reescalaba. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <title>cotea</title>
    <!-- Reset por URL — fix/actualizacion-pwa 2026-09-16 -----------------
      Interruptor de emergencia: si la PWA queda atrapada con un Service
      Worker roto, abrir la app con `?_reset=1` desregistra TODOS los SW,
      borra las caches de Workbox y recarga en limpio. Se ejecuta ANTES de
      cargar main.jsx para no depender de que la app arranque.

      Es crítico que este script:
        · Sea inline (no depende de un fetch que el SW podría interceptar).
        · Corra antes que /src/main.jsx (que registra el SW).
        · No dependa de librerías (React, Firebase, etc. aún no cargan aquí).

      Uso: mandar por WhatsApp `https://campo-fosmon.netlify.app/?_reset=1`
      al usuario atrapado. Ver ROLLBACK_PWA.md.
    -->
    <script>
      (function () {
        try {
          if (new URLSearchParams(location.search).get('_reset') !== '1') return;
          document.documentElement.style.background = '#F0F2F5';
          document.write(
            '<div style="font:14px system-ui;padding:40px 20px;text-align:center;color:#4A5560">' +
            'Reiniciando cotea…<br><br>' +
            '<span style="font-size:11px;color:#9AA3AC">Limpiando caché y volviendo a cargar.</span>' +
            '</div>'
          );
          var pasos = [];
          if ('serviceWorker' in navigator) {
            pasos.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () { /* ignore */ })
            );
          }
          if (typeof caches !== 'undefined') {
            pasos.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () { /* ignore */ })
            );
          }
          Promise.all(pasos).then(function () {
            location.replace('/');
          });
          // Cinturón: si algo se cuelga, recarga a los 4s de todas formas.
          setTimeout(function () { location.replace('/'); }, 4000);
        } catch (e) {
          location.replace('/');
        }
      })();
    </script>
    <style>
      /* Safe areas iPhone: cuando la PWA se instala en iOS, evita que el header
         se meta debajo de la barra de estado (hora, señal, batería) y el fondo
         se pinte hasta abajo respetando el home indicator del iPhone. */
      html, body {
        margin: 0;
        padding: 0;
        /* Fondo GRIS CLARO (mismo que la app) en vez de negro caliza —
           evita 'franjas negras' cuando el contenido no llena el ancho del
           viewport (por scroll horizontal accidental de una tabla o header
           que se pasa unos pixeles). */
        background: #F0F2F5;
        /* Prevenir scroll horizontal a nivel documento. Cualquier scroll debe
           ser interno de un contenedor (tabla, subtabs), nunca de la página. */
        overflow-x: hidden;
        width: 100%;
      }
      #root {
        min-height: 100vh;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        background: #F0F2F5;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
